  .sb.battle-mode { border-color:#d98aa4; box-shadow:inset 0 0 0 1px rgba(224,106,138,.25),0 8px 28px rgba(0,0,0,.48),0 0 20px rgba(224,106,138,.18); }
  .corner { position:absolute; width:24px; height:24px; border:1px solid var(--mg-gold); z-index:3; pointer-events:none; }

  .c-tl { top:6px; left:6px; border-right:0; border-bottom:0; }

  .c-bl { bottom:6px; left:6px; border-right:0; border-top:0; }
  .c-br { bottom:6px; right:6px; border-left:0; border-top:0; }
  .magic-circle {
    position:absolute; z-index:-1; top:-112px; left:50%; width:300px; height:300px;
    transform:translateX(-50%); border:1px dashed rgba(212,182,110,.28);
    border-radius:50%; animation:mg-spin 90s linear infinite; pointer-events:none;
  }
  .magic-circle::before,.magic-circle::after { content:''; position:absolute; border-radius:50%; }
  .magic-circle::before { inset:24px; border:1px solid rgba(212,182,110,.17); }
  .magic-circle::after { inset:54px; border:1px dotted rgba(242,166,200,.2); }
  @keyframes mg-spin { to { transform:translateX(-50%) rotate(360deg); } }

  .summary { position:relative; padding:2px 2px 15px; border-bottom:1px solid var(--mg-gold-soft); }
  .summary-tools {
    display:flex; justify-content:flex-end; align-items:center; gap:6px; min-height:40px;

  .sync-status {

  .sync-status[data-state="loading"]::before { background:var(--mg-gold); animation:mg-pulse 1.3s ease-in-out infinite; }
  .sync-status[data-state="error"]::before { background:var(--mg-danger); }
  @keyframes mg-pulse { 50% { opacity:.35; } }
  .icon-button {

  .world-date { text-align:center; color:#d4c79f; font-size:11px; letter-spacing:2.2px; overflow-wrap:anywhere; }
  .world-place { margin-top:4px; text-align:center; font-size:19px; letter-spacing:2.4px; color:#fff; text-shadow:0 0 15px rgba(135,157,255,.32); overflow-wrap:anywhere; }

    overflow-wrap:anywhere;

  .summary-user {

  .summary-user-meta strong { display:block; color:#fff; font-size:15px; letter-spacing:1.5px; overflow-wrap:anywhere; }

  .mini-mana { align-self:center; }

  .track { position:relative; height:7px; margin-top:4px; overflow:hidden; border:1px solid rgba(212,182,110,.25); border-radius:99px; background:rgba(255,255,255,.07); }
  .fill { display:block; height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg,var(--mg-pink),#ae91e7,var(--mg-blue)); box-shadow:0 0 8px rgba(174,145,231,.58); transition:width .45s ease; }
  .sb[data-collapsed="true"] .hud-content { display:none; }

  .tabs {

  .tab {

  }
  .tab:hover { color:#fff; background:rgba(255,255,255,.045); }

  .tab-icon { display:block; color:var(--mg-gold); font-size:15px; line-height:1; margin-bottom:2px; }

  .section-title {

  .field-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:7px; }
  .field {
    padding:7px 9px; border:1px solid rgba(212,182,110,.16); border-radius:6px;
    background:rgba(255,255,255,.025); overflow:hidden;

  .field.wide { grid-column:1/-1; }

  .profile-head { display:flex; align-items:center; gap:15px; padding:4px 2px 12px; }

  .badge { color:#ffe1ed; border:1px solid rgba(242,166,200,.42); background:rgba(242,166,200,.09); }

  .character-toolbar {
    display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center; margin-bottom:10px;
  }
  .search {

    color:var(--mg-muted); cursor:pointer;

  .filter[aria-pressed="true"] { color:#fff; background:rgba(135,157,255,.16); }
  .character-group-title { display:flex; justify-content:space-between; margin:12px 1px 7px; color:#d6c487; font-size:10px; letter-spacing:2px; }

  .character-card {
    display:grid; grid-template-columns:50px minmax(0,1fr); gap:10px; align-items:start;

    background:rgba(255,255,255,.035); cursor:pointer; transition:.18s ease;
  }
  .character-card:hover { border-color:rgba(242,166,200,.5); background:rgba(255,255,255,.06); transform:translateY(-1px); }

  .empty-note { padding:24px 12px; text-align:center; color:var(--mg-muted); letter-spacing:1px; }

  .bond {
    margin-top:8px; padding:8px 9px; border:1px solid color-mix(in srgb,var(--role-accent) 36%,transparent);
    border-radius:7px; background:var(--role-soft);
  }
  .bond.compact { margin-top:6px; padding:5px 7px; }
  .bond-label { display:flex; justify-content:space-between; gap:8px; color:#f5e9ff; font-size:10px; overflow-wrap:anywhere; }
  .bond-label strong { color:var(--role-accent); font-weight:500; }
  .bond .track { border-color:color-mix(in srgb,var(--role-accent) 40%,transparent); }
  .bond .fill { background:linear-gradient(90deg,var(--mg-pink),var(--role-accent)); box-shadow:0 0 9px color-mix(in srgb,var(--role-accent) 52%,transparent); }

  .avatar-button {
    position:relative; display:grid; place-items:center; width:68px; height:68px; padding:0;
    overflow:hidden; flex:0 0 auto; border:2px solid #1a1e47; border-radius:50%;
    outline:1px solid var(--mg-gold); background:radial-gradient(circle at 32% 25%,#eda4c7,#7186db 72%);
    color:#fff; cursor:pointer; box-shadow:0 0 14px rgba(135,157,255,.2);
  }
  .avatar-button.small { width:48px; height:48px; border-width:1px; font-size:15px; }
  .avatar-button.medium { width:56px; height:56px; }
  .avatar-button:hover::after,.avatar-button:focus-visible::after {
    content:'✎'; position:absolute; inset:auto 0 0; padding:1px 0 3px;
    background:rgba(5,8,28,.74); color:#fff; font-size:10px;
  }
  .avatar-button img,.avatar-preview img {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transform-origin:center; pointer-events:none;
  }

  .avatar-button.small .avatar-fallback { font-size:17px; }
  .avatar-button.tf { box-shadow:0 0 0 2px rgba(242,166,200,.22),0 0 18px rgba(242,166,200,.47); }

  .drawer-hero {
    display:grid; grid-template-columns:minmax(170px,220px) minmax(0,1fr); gap:15px;
    align-items:start; margin-bottom:12px;
  }
  .portrait-feature { min-width:0; }
  .profile-head > .portrait-feature { width:142px; flex:0 0 142px; }
  .drawer-hero > .portrait-feature { width:auto; }
  .portrait-stage {
    position:relative; display:grid; place-items:center; width:100%; aspect-ratio:4/5; padding:0;
    overflow:hidden; border:1px solid var(--role-accent); border-radius:12px;
    background:
      radial-gradient(circle at 50% 18%,color-mix(in srgb,var(--role-accent) 26%,transparent),transparent 48%),
      linear-gradient(155deg,#171c45,#28204a);

  }
  button.portrait-stage { cursor:pointer; }
  .portrait-stage img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; }
  .portrait-stage img,.cg-media img,.lightbox-stage img { transition:opacity .18s ease,transform .22s ease; }

  .portrait-stage .avatar-fallback { font-size:48px; }
  .portrait-form {
    position:absolute; z-index:2; left:8px; bottom:8px; max-width:calc(100% - 16px);
    padding:4px 9px; border:1px solid rgba(255,255,255,.35); border-radius:99px;

    min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:6px 11px; border:1px solid rgba(212,182,110,.32); border-radius:8px;
    background:rgba(255,255,255,.04); color:var(--mg-muted); cursor:pointer;
  }
  .portrait-settings:hover { color:#fff; border-color:var(--mg-gold); }
  .drawer-identity strong { display:block; color:#fff; font-size:20px; letter-spacing:2px; overflow-wrap:anywhere; }
  .drawer-identity > span { display:block; margin-top:3px; color:var(--mg-muted); font-size:10px; overflow-wrap:anywhere; }

  .gallery-role-strip {
    display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin-bottom:11px;
  }
  .gallery-role {
    min-height:46px; padding:6px 5px; border:1px solid rgba(212,182,110,.22); border-radius:8px;
    background:rgba(255,255,255,.028); color:var(--mg-muted); cursor:pointer;
    font-size:9px; line-height:1.3; overflow-wrap:anywhere;
  }
  .gallery-role strong { display:block; color:#fff; font-size:11px; font-weight:500; }
  .gallery-role[aria-pressed="true"] {
    border-color:var(--role-accent); background:var(--role-soft); color:#fff;
    box-shadow:inset 0 0 14px color-mix(in srgb,var(--role-accent) 13%,transparent);
  }
  .gallery-role.anonymous { cursor:default; border-style:dashed; color:var(--mg-dim); }
  .gallery-overview {
    display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center;
    margin-bottom:10px; padding:10px 11px; border:1px solid color-mix(in srgb,var(--role-accent) 32%,transparent);
    border-radius:9px; background:var(--role-soft);
  }
  .gallery-overview h3 { margin:0; color:#fff; font-size:16px; font-weight:500; letter-spacing:1.5px; overflow-wrap:anywhere; }
  .gallery-overview p { margin:2px 0 0; color:var(--mg-muted); font-size:9px; overflow-wrap:anywhere; }
  .gallery-count { color:var(--role-accent); font-size:12px; white-space:nowrap; }
  .cg-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  .cg-card {
    position:relative; min-height:168px; overflow:hidden; border:1px solid rgba(212,182,110,.22);
    border-radius:10px; background:rgba(255,255,255,.025);
  }
  .cg-card.unlocked { border-color:color-mix(in srgb,var(--role-accent) 44%,transparent); }

    display:block; width:100%; padding:0; border:0; background:transparent; text-align:left; cursor:pointer;
  }

    position:relative; display:grid; place-items:center; width:100%; aspect-ratio:16/11;

  }

  .cg-open:hover .cg-media img { transform:scale(1.025); }
  .cg-image-error { padding:14px; color:var(--mg-muted); font-size:10px; text-align:center; }
  .cg-copy { padding:9px 10px 10px; }
  .cg-copy > span { display:block; }
  .cg-id { color:var(--role-accent); font-size:9px; letter-spacing:1px; }
  .cg-title { margin-top:2px; color:#fff; font-size:13px; overflow-wrap:anywhere; }
  .cg-unlock-hint { margin-top:5px; color:var(--mg-muted); font-size:9px; line-height:1.45; overflow-wrap:anywhere; }
  .cg-card.locked {
    display:flex; flex-direction:column; justify-content:center; padding:14px;
    background:
      radial-gradient(circle at 50% 34%,color-mix(in srgb,var(--role-accent) 13%,transparent),transparent 37%),
      rgba(255,255,255,.018);
  }
  .cg-lock-mark { color:var(--role-accent); font-size:28px; text-align:center; text-shadow:0 0 15px color-mix(in srgb,var(--role-accent) 58%,transparent); }
  .cg-card.locked .cg-copy { padding:6px 0 0; text-align:center; }
  .recent-cg-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin-top:8px; }
  .recent-cg {
    padding:7px; border:1px solid rgba(212,182,110,.2); border-radius:7px;
    background:rgba(255,255,255,.025); color:#e8e3f8; font-size:9px; overflow-wrap:anywhere;
  }
  .lightbox-card { width:min(100%,680px); }
  .lightbox-stage {
    position:relative; display:grid; place-items:center; min-height:180px; max-height:560px;
    overflow:hidden; border:1px solid color-mix(in srgb,var(--role-accent) 42%,transparent);
    border-radius:9px; background:#090d28;
  }

  .timeline { position:relative; margin:4px 0 0 7px; padding-left:19px; border-left:1px solid rgba(212,182,110,.35); }
  .timeline-item { position:relative; margin:0 0 12px; color:#ddd7ee; overflow-wrap:anywhere; }
  .timeline-item::before { content:'✦'; position:absolute; left:-26px; top:-1px; color:var(--mg-gold); background:#171b43; }

  .extra-details { margin-top:9px; border:1px dashed rgba(135,157,255,.25); border-radius:7px; }
  .extra-details > summary { padding:7px 9px; color:#aaa8cf; font-size:10px; cursor:pointer; letter-spacing:1px; }
  .extra-tree { padding:0 9px 9px; }
  .extra-node { padding:5px 0 5px 10px; border-left:1px solid rgba(135,157,255,.2); overflow-wrap:anywhere; }

  .extra-value { margin-left:6px; color:#d4cee7; font-size:10px; white-space:pre-wrap; }

  .overlay {

    min-height:42px; width:100%; padding:8px 10px; border:1px solid rgba(212,182,110,.32);

  .avatar-preview {

  .form-hint { margin:5px 0 0; color:var(--mg-dim); font-size:9px; }
  .form-error { min-height:20px; margin-top:7px; color:#ffb1c1; font-size:10px; }
  .dialog-actions { display:flex; justify-content:flex-end; gap:7px; flex-wrap:wrap; margin-top:10px; }
  .action-button {
    min-height:40px; padding:7px 13px; border:1px solid rgba(212,182,110,.35);
    border-radius:7px; background:rgba(255,255,255,.045); color:#e9e4f8; cursor:pointer;
  }
  .action-button.primary { border-color:rgba(242,166,200,.55); background:linear-gradient(135deg,rgba(242,166,200,.2),rgba(135,157,255,.16)); color:#fff; }
  .action-button.danger { color:#ffb1c1; border-color:rgba(255,143,165,.35); }
  .foot { margin-top:13px; padding-top:9px; border-top:1px solid rgba(212,182,110,.2); text-align:center; color:#777190; font-size:8px; letter-spacing:3px; }

  @media (max-width:560px) {

  }
  @media (max-width:360px) {

    .overlay { padding:7px; }

    .magic-circle { animation:none; }
  }
  @supports not (backdrop-filter:blur(4px)) {
    .overlay { background:rgba(5,7,23,.94); }

<section class="sb" id="sb" data-collapsed="false" data-mg-hud-root="v2" aria-label="星夜魔导书状态栏">

        <div class="dialog-actions">
          <button class="action-button danger" type="button" data-action="reset-avatar">清除本机覆盖</button>
          <button class="action-button" type="button" data-action="close-avatar">取消</button>
          <button class="action-button primary" type="button" data-action="save-avatar">保存头像</button>
        </div>
      </div>
    </section>
  </div>
  <div class="overlay" data-cg-lightbox role="dialog" aria-modal="true" aria-labelledby="mg-lightbox-title" hidden>

        </div>
      </div>
    </section>
  </div>
  <div class="sr-only" data-hud-live aria-live="polite"></div>

<script type="module">
  const $ = (selector, root = document) => root.querySelector(selector);
  const all = (selector, root = document) => Array.from(root.querySelectorAll(selector));
  const root = $('#sb');

  const ASSET_BASE_URL = 'https://cdn.jsdelivr.net/gh/1798547983tt/Princess@main/xiabanmo/assets/';
  const PORTRAIT_CATALOG = Object.freeze(JSON.parse($('#mg-portrait-catalog').textContent));
  const CG_CATALOG = Object.freeze(JSON.parse($('#mg-cg-catalog').textContent));
  const PORTRAIT_ROLES = Object.freeze(Object.keys(PORTRAIT_CATALOG));
  const GALLERY_ROLES = Object.freeze(PORTRAIT_ROLES.filter(role => {
    const portrait = PORTRAIT_CATALOG[role];
    return !portrait.portraitOnly && CG_CATALOG.some(item => item.role === role);
  }));
  const BUILTIN_AVATARS = Object.freeze({
    ...Object.fromEntries(PORTRAIT_ROLES
      .filter(role => PORTRAIT_CATALOG[role].transformed || PORTRAIT_CATALOG[role].civilian)
      .map(role => [role,assetUrl(PORTRAIT_CATALOG[role].transformed || PORTRAIT_CATALOG[role].civilian)])),
    '摩可': assetUrl('角色立绘/摩可立绘/摩可立绘.png'),
  });
  const AVATAR_ALIASES = Object.freeze({
    '林昀': '翠雀',
    '矢车菊': '翠雀',
    '林小璐': '白玫',
    '夏凉': '小锦',
    '白静萱': '薄雪',
    '红思与': '朝颜',
    '麻生圆香': '玛格丽特',
    '安雅': '樱',
    '陆红豆': '鸢',
  });
  const AVATAR_STORAGE_KEY = 'mg-sb-avatar-v2';
  const ROOT_KEYS = new Set(['世界','主线','user','在场人物','不在场人物','关系','图鉴','检定','事件','持有物']);
  const WORLD_KEYS = new Set(['日期','时段','地点','场景','天气']);
  const STORY_KEYS = new Set(['当前节点','已达成节点','篇章提要']);
  const USER_KEYS = new Set(['姓名','性别','年龄','身份','原作绑定','背景','外观','装束','代号','认证牌','开华阶段','变身状态','魔力','伤势','魔装','心核','状态效果']);
  const CHARACTER_KEYS = new Set(['本名','代号','阵营','身份','开华阶段','变身状态','魔力','伤势','魔装','心核','当前位置','当前行动','特殊状态']);
  const RELATION_KEYS = new Set(['好感','关系','称呼']);
  const CHECK_KEYS = new Set(['本回合','战斗中','敌人']);
  const ROLL_KEYS = new Set(['行动','骰值','判定','缘由']);
  const EVENT_KEYS = new Set(['进行中','大事记']);
  const EVENT_ITEM_KEYS = new Set(['名称','进展']);
  const ENEMY_KEYS = new Set(['名称','等级','状态']);
  const ITEM_KEYS = new Set(['描述','数量']);
  const GEAR_KEYS = new Set(['名称','形态','完损']);
  const CORE_KEYS = new Set(['形态','状态']);
  const BLOOM = Object.freeze({ '无':0,'种':1,'芽':2,'叶':3,'蕾':4,'花':5 });
  const BOND_STAGES = Object.freeze([
    [200,'命定之绊'],
    [170,'不可替代'],
    [140,'深厚羁绊'],
    [110,'亲近'],
    [80,'信赖'],
    [50,'熟稔'],
    [20,'相识'],
    [0,'陌生'],
  ]);

  const state = {
    stat:{},
    lastGood:null,
    activeTab:'traveler',
    presence:'all',
    search:'',
    searchComposing:false,
    characterIndex:new Map(),
    openCharacterKey:'',
    returnFocus:null,
    portraitVariants:{},
    galleryRole:'',
    lightboxId:'',
    lightboxRole:'',
    lightboxReturnFocus:null,
    avatarStore:loadAvatarStore(),
    avatarDraft:null,
    avatarReturnFocus:null,
    messageId:'latest',
    renderSignature:'',
    refreshTimer:null,
    disposers:[],
  };

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }
  function isObj(value) { return !!value && typeof value === 'object' && !Array.isArray(value); }
  function object(value) { return isObj(value) ? value : {}; }
  function array(value) { return Array.isArray(value) ? value : []; }
  function text(value, fallback = '') {
    if (value === undefined || value === null || value === '') return fallback;
    if (typeof value === 'string') return value;
    if (typeof value === 'number' || typeof value === 'boolean') return String(value);
    try { return JSON.stringify(value); } catch (_) { return fallback; }
  }
  function number(value, fallback = 0) {
    const parsed = Number(value);
    return Number.isFinite(parsed) ? parsed : fallback;
  }
  function clamp(value, min, max) { return Math.min(max, Math.max(min, number(value, min))); }
  function firstGlyph(value) { return Array.from(text(value,'✦').trim())[0] || '✦'; }
  function assetUrl(relativePath) {
    return ASSET_BASE_URL + text(relativePath).split('/').map(part => encodeURIComponent(part)).join('/');
  }
  function exactNames(values) {
    return values.map(value => text(value).trim()).filter(Boolean);
  }
  function roleFromNames(values) {
    const names = exactNames(values);
    return PORTRAIT_ROLES.find(role => {
      const item = PORTRAIT_CATALOG[role];
      return names.includes(item.realName) || names.includes(item.codeName);
    }) || '';
  }
  function portraitIdentity(owner,recordKey,entity) {
    const data = object(entity);
    const names = owner === 'user'
      ? exactNames([data.原作绑定,data.姓名,data.代号])
      : exactNames([recordKey,data.本名,data.代号]);
    const role = roleFromNames(names);
    if (!role) return { role:'',civilian:false,transformed:false,catalog:null };
    const catalog = PORTRAIT_CATALOG[role];
    const transformedState = text(data.变身状态,'未变身') !== '未变身';
    return {
      role,
      civilian:Boolean(catalog.civilian) && names.includes(catalog.realName),
      transformed:Boolean(catalog.transformed) && (
        names.includes(catalog.codeName)
        || (!catalog.civilian && transformedState && names.includes(catalog.realName))
      ),
      catalog,
    };
  }
  function portraitStateKey(owner,recordKey,role) {
    return owner + ':' + (recordKey || 'user') + ':' + role;
  }
  function defaultPortraitVariant(identity,entity) {
    const transformed = text(object(entity).变身状态,'未变身') !== '未变身';
    if (transformed && identity.transformed) return 'transformed';
    if (identity.civilian) return 'civilian';
    if (identity.transformed) return 'transformed';
    return '';
  }
  function currentPortraitVariant(owner,recordKey,entity,identityOverride) {
    const identity = identityOverride || portraitIdentity(owner,recordKey,entity);
    if (!identity.role) return '';
    const available = [];
    if (identity.civilian) available.push('civilian');
    if (identity.transformed) available.push('transformed');
    const manual = state.portraitVariants[portraitStateKey(owner,recordKey,identity.role)];
    return available.includes(manual) ? manual : defaultPortraitVariant(identity,entity);
  }
  function portraitDescriptor(owner,recordKey,entity) {
    const identity = portraitIdentity(owner,recordKey,entity);
    if (!identity.role) {
      const key = canonicalAvatarKey(owner === 'user'
        ? [object(entity).代号,object(entity).原作绑定,object(entity).姓名,'user']
        : [object(entity).代号,recordKey,object(entity).本名]);
      return {
        identity,
        variant:'',
        key,
        builtin:BUILTIN_AVATARS[key] || '',
      };
    }
    const variant = currentPortraitVariant(owner,recordKey,entity,identity);
    const relativePath = variant === 'transformed'
      ? identity.catalog.transformed
      : identity.catalog.civilian;
    return {
      identity,
      variant,
      key:'portrait:' + identity.role + ':' + variant,
      builtin:relativePath ? assetUrl(relativePath) : '',
    };
  }
  function revealedRoleEvidence(stat,role) {
    const catalog = PORTRAIT_CATALOG[role];
    const names = [];
    [object(stat.在场人物),object(stat.不在场人物)].forEach(group => {
      Object.entries(group).forEach(entry => {
        names.push(entry[0],object(entry[1]).本名,object(entry[1]).代号);
      });
    });
    names.push(...Object.keys(object(stat.关系)));
    const normalized = exactNames(names);
    return {
      role,
      catalog,
      civilian:Boolean(catalog.civilian) && normalized.includes(catalog.realName),
      transformed:Boolean(catalog.transformed) && normalized.includes(catalog.codeName),
    };
  }
  function isSelfBoundRole(stat,role) {
    const user = object(stat.user);
    const catalog = PORTRAIT_CATALOG[role];
    const binding = text(user.原作绑定).trim();
    if (binding === catalog.realName || binding === catalog.codeName) return true;
    if (binding) return false;
    return text(user.姓名).trim() === catalog.realName && text(user.代号).trim() === catalog.codeName;
  }
  function roleDisplayName(evidence) {
    if (evidence.civilian && evidence.transformed) return evidence.catalog.codeName + ' / ' + evidence.catalog.realName;
    if (evidence.transformed) return evidence.catalog.codeName;
    if (evidence.civilian) return evidence.catalog.realName;
    return '未揭露';
  }
  function roleRelation(stat,role) {
    const relations = object(stat.关系);
    const catalog = PORTRAIT_CATALOG[role];
    return object(relations[role] || relations[catalog.realName]);
  }
  function unlockedCgIds(stat) {
    return new Set(array(object(stat.图鉴).已解锁CG).map(value => text(value)).filter(Boolean));
  }
  function visibleCgId(item,evidence) {
    return evidence.transformed ? item.id : item.id.replace(/^.+?_/, '');
  }
  function visibleCgText(value,evidence) {
    let result = text(value);
    if (evidence.civilian && !evidence.transformed) {
      result = result.split(evidence.catalog.codeName).join(evidence.catalog.realName);
    } else if (evidence.transformed && !evidence.civilian) {
      result = result.split(evidence.catalog.realName).join(evidence.catalog.codeName);
    }
    return result;
  }
  function displayValue(value) {
    if (value === undefined || value === null || value === '') return '—';
    if (typeof value === 'boolean') return value ? '是' : '否';
    if (Array.isArray(value)) return value.length ? value.map(item => text(item,'—')).join(' · ') : '—';
    if (isObj(value)) return Object.keys(value).length ? '详见下方' : '—';
    return String(value);
  }
  function heading(title, note) {
    const head = el('div','panel-heading');
    head.appendChild(el('h2','',title));
    if (note) head.appendChild(el('p','',note));
    return head;
  }
  function section(title) {
    const node = el('section','section');
    node.appendChild(el('h3','section-title',title));
    return node;
  }
  function field(label, value, wide = false) {
    const node = el('div','field' + (wide ? ' wide' : ''));
    node.appendChild(el('span','field-label',label));
    node.appendChild(el('span','field-value',displayValue(value)));
    return node;
  }
  function fieldGrid(entries) {
    const grid = el('div','field-grid');
    entries.forEach(entry => grid.appendChild(field(entry[0],entry[1],!!entry[2])));
    return grid;
  }
  function badge(value) { return el('span','badge',value); }
  function chip(value) { return el('span','chip',value); }
  function chips(values) {
    const box = el('div','chips');
    const list = array(values);
    if (!list.length) box.appendChild(chip('无'));
    else list.forEach(value => box.appendChild(chip(text(value,'—'))));
    return box;
  }
  function manaBlock(value, compact = false) {
    const mana = clamp(value,0,100);
    const box = el('div',compact ? 'mini-mana' : 'mana-large');
    const label = el('div',compact ? 'mini-mana-label' : 'mana-large-label');
    label.appendChild(el('span','',compact ? '魔力' : '魔 力'));
    label.appendChild(el('span','',mana + ' / 100'));
    const track = el('div','track');
    const fill = el('i','fill');
    fill.style.width = mana + '%';
    track.appendChild(fill);
    box.append(label,track);
    return box;
  }
  function bondStage(value) {
    const score = clamp(value,0,200);
    return BOND_STAGES.find(item => score >= item[0])[1];
  }
  function bondBlock(value,compact = false) {
    const score = Math.round(clamp(value,0,200));
    const box = el('div',compact ? 'bond compact' : 'bond');
    box.dataset.bondScore = '';
    box.setAttribute('role','progressbar');
    box.setAttribute('aria-label','好感 ' + score + ' / 200，' + bondStage(score));
    box.setAttribute('aria-valuemin','0');
    box.setAttribute('aria-valuemax','200');
    box.setAttribute('aria-valuenow',String(score));
    const label = el('div','bond-label');
    label.append(el('strong','','♥ ' + bondStage(score)),el('span','',score + ' / 200'));
    const track = el('div','track');
    const fill = el('i','fill');
    fill.style.width = score / 2 + '%';
    track.appendChild(fill);
    box.append(label,track);
    return box;
  }
  function bloomView(stageValue) {
    const stage = clamp(BLOOM[text(stageValue,'无')] || 0,0,5);
    const box = el('div','bloom');
    box.appendChild(el('span','','开华'));
    for (let index=0; index<5; index++) box.appendChild(el('span','petal' + (index<stage ? ' on' : ''),'❀'));
    return box;
  }
  function addExtras(host, source, knownKeys, title = '附加资料') {
    const sourceObject = object(source);
    const keys = Object.keys(sourceObject).filter(key => !knownKeys.has(key));
    if (!keys.length) return;
    const details = el('details','extra-details');
    details.open = true;
    details.appendChild(el('summary','',title));
    const tree = el('div','extra-tree');
    keys.forEach(key => tree.appendChild(extraNode(key,sourceObject[key],0)));
    details.appendChild(tree);
    host.appendChild(details);
  }
  function extraNode(label, value, depth) {
    const node = el('div','extra-node');
    node.appendChild(el('span','extra-key',label));
    if (depth >= 5) {
      node.appendChild(el('span','extra-value',displayValue(value)));
      return node;
    }
    if (Array.isArray(value)) {
      if (!value.length) node.appendChild(el('span','extra-value','—'));
      else value.forEach((item,index) => node.appendChild(extraNode(String(index+1),item,depth+1)));
    } else if (isObj(value)) {
      const keys = Object.keys(value);
      if (!keys.length) node.appendChild(el('span','extra-value','—'));
      else keys.forEach(key => node.appendChild(extraNode(key,value[key],depth+1)));
    } else {
      node.appendChild(el('span','extra-value',displayValue(value)));
    }
    return node;
  }

  function loadAvatarStore() {
    try {
      const parsed = JSON.parse(localStorage.getItem(AVATAR_STORAGE_KEY) || '{}');
      return isObj(parsed) && isObj(parsed.entries) ? parsed : { version:2, entries:{} };
    } catch (_) {
      return { version:2, entries:{} };
    }
  }
  function saveAvatarStore() {
    try {
      localStorage.setItem(AVATAR_STORAGE_KEY,JSON.stringify(state.avatarStore));
      return true;
    } catch (_) {
      return false;
    }
  }
  function canonicalAvatarKey(values) {
    const candidates = values.map(value => text(value).trim()).filter(Boolean);
    const codes = Object.keys(BUILTIN_AVATARS);
    for (const candidate of candidates) {
      for (const code of codes) if (candidate === code || candidate.includes(code)) return code;
      for (const alias of Object.keys(AVATAR_ALIASES)) {
        if (candidate === alias || candidate.includes(alias)) return AVATAR_ALIASES[alias];
      }
    }
    return candidates[0] || '未命名旅人';
  }
  function avatarIdentity(owner, recordKey, entity) {
    return portraitDescriptor(owner,recordKey,entity).key;
  }
  function validHttps(value) {
    try { return new URL(value).protocol === 'https:'; } catch (_) { return false; }
  }
  function validLocalImage(value) {
    return /^data:image\/(?:png|jpeg|webp|gif);base64,/i.test(text(value));
  }
  function safeAvatarSource(value) {
    const source = text(value).trim();
    return validHttps(source) || validLocalImage(source) ? source : '';
  }
  function avatarSettings(key,builtinOverride = '') {

    }
    const builtin = safeAvatarSource(builtinOverride || BUILTIN_AVATARS[key]);
    return { src:builtin, zoom:1, x:50, y:50, source:builtin ? 'builtin' : 'fallback' };
  }

  function revealAfterDecode(image) {
    image.dataset.imageLoading = '';
    const reveal = () => {
      const decoded = typeof image.decode === 'function' ? image.decode() : Promise.resolve();
      Promise.resolve(decoded).catch(() => {}).then(() => image.removeAttribute('data-image-loading'));
    };
    if (image.complete && image.naturalWidth) reveal();
    else image.addEventListener('load',reveal,{ once:true });
  }
  function applyAvatar(container,key,display,settingsOverride,builtinOverride = '') {
    const settings = settingsOverride || avatarSettings(key,builtinOverride);
    container.replaceChildren(el('span','avatar-fallback',firstGlyph(display)));
    if (!settings.src) return;
    const image = el('img');
    image.alt = '';
    image.loading = 'lazy';
    image.decoding = 'async';
    image.referrerPolicy = 'no-referrer';
    image.src = settings.src;
    revealAfterDecode(image);
    image.style.objectPosition = settings.x + '% ' + settings.y + '%';
    image.style.transformOrigin = settings.x + '% ' + settings.y + '%';
    image.style.transform = 'scale(' + settings.zoom + ')';
    image.addEventListener('error',() => { image.hidden = true; });
    container.appendChild(image);
  }

  function collectCharacters(stat) {
    const present = object(stat.在场人物);
    const away = object(stat.不在场人物);
    const relations = object(stat.关系);
    const list = [];
    const represented = new Set();
    function relationFor(key,entity) {
      const data = object(entity);
      return [key,data.代号,data.本名]
        .map(value => text(value).trim())
        .filter(Boolean)
        .map(value => relations[value])
        .find(value => isObj(value)) || null;
    }
    function addGroup(group,presence) {
      Object.keys(group).forEach(key => {
        const entity = object(group[key]);
        [key,entity.本名,entity.代号].map(value => text(value).trim()).filter(Boolean).forEach(value => represented.add(value));
        list.push({ key,presence,entity,relation:relationFor(key,entity) });
      });
    }
    addGroup(present,'present');
    addGroup(away,'away');
    Object.keys(relations).forEach(key => {
      if (!represented.has(key)) {
        list.push({ key,presence:'relation',entity:{ 本名:key },relation:object(relations[key]) });
      }
    });
    state.characterIndex = new Map(list.map(item => [item.key,item]));
    return list;
  }
  function matchesCharacter(item) {
    if (state.presence !== 'all' && item.presence !== state.presence) return false;
    const query = state.search.trim().toLowerCase();
    if (!query) return true;
    const haystack = [item.key,item.entity.本名,item.entity.代号,item.entity.身份,item.entity.阵营,item.relation && item.relation.关系].map(value => text(value).toLowerCase()).join(' ');
    return haystack.includes(query);
  }

  function readFileAsDataUrl(file) {
    return new Promise((resolve,reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => reject(new Error('读取图片失败'));
      reader.readAsDataURL(file);
    });
  }
  function loadImage(source) {
    return new Promise((resolve,reject) => {

      image.src = source;
    });
  }
  async function compressAvatar(file) {
    if (!file || !/^image\/(?:png|jpeg|webp|gif)$/i.test(file.type)) throw new Error('请选择 PNG、JPEG、WebP 或 GIF 图片。');
    if (file.size > 8*1024*1024) throw new Error('图片不能超过 8MB。');
    const source = await readFileAsDataUrl(file);
    const image = await loadImage(source);
    const attempts = [
      { max:640,quality:.84 },
      { max:480,quality:.76 },
      { max:360,quality:.68 },
    ];
    let result = '';
    for (const attempt of attempts) {
      const scale = Math.min(1,attempt.max/Math.max(image.naturalWidth || image.width,image.naturalHeight || image.height));
      const width = Math.max(1,Math.round((image.naturalWidth || image.width)*scale));
      const height = Math.max(1,Math.round((image.naturalHeight || image.height)*scale));
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const context = canvas.getContext('2d',{ alpha:true });
      if (!context) throw new Error('当前浏览器无法处理图片。');
      context.drawImage(image,0,0,width,height);
      result = canvas.toDataURL('image/webp',attempt.quality);
      if (!result.startsWith('data:image/webp')) result = canvas.toDataURL('image/png');
      if (result.length <= 720000) break;
    }
    if (!validLocalImage(result) || result.length > 900000) throw new Error('图片压缩后仍过大，请换一张尺寸更小的图片。');
    return result;
  }

        else if (action === 'open-cg') openCgLightbox(actionNode.dataset.cgOpenId,actionNode);
        else if (action === 'close-cg') closeCgLightbox();
        else if (action === 'previous-cg') stepCgLightbox(-1);
        else if (action === 'next-cg') stepCgLightbox(1);
        return;
      }
      const tab = event.target.closest('[data-hud-tab]');
      if (tab) { activateTab(tab.dataset.hudTab,true); return; }
      const filter = event.target.closest('[data-presence-filter]');
      if (filter) { state.presence = filter.dataset.presenceFilter; renderCharacters(state.stat); return; }
      const galleryRole = event.target.closest('[data-gallery-role]');
      if (galleryRole) {
        state.galleryRole = galleryRole.dataset.galleryRole;
        renderGallery(state.stat);
        return;
      }
      const portrait = event.target.closest('[data-portrait-toggle]');
      if (portrait) {
        togglePortrait(portrait.dataset.portraitOwner,portrait.dataset.portraitRecordKey || '');
        return;
      }
      const character = event.target.closest('[data-character-key]');
      if (character) openCharacterDrawer(character.dataset.characterKey,character);
      const overlay = event.target.matches('.overlay') ? event.target : null;
      if (overlay && overlay.hasAttribute('data-character-drawer')) closeCharacterDrawer();
      else if (overlay && overlay.hasAttribute('data-avatar-dialog')) closeAvatarEditor();
      else if (overlay && overlay.hasAttribute('data-cg-lightbox')) closeCgLightbox();
    });
    root.addEventListener('input',event => {
      if (event.target.matches('[data-character-search]')) {
        state.search = event.target.value;
        if (state.searchComposing || event.isComposing) return;
        renderCharacters(state.stat);
        const next = $('[data-character-search]');
        if (next) { next.focus(); next.setSelectionRange(state.search.length,state.search.length); }
      }
      if (event.target.matches('[data-avatar-zoom],[data-avatar-x],[data-avatar-y]')) {
        readAvatarControls();
        updateAvatarPreview();
      }
      if (event.target.matches('[data-avatar-url]') && state.avatarDraft) {
        const value = event.target.value.trim();
        if (!value || validHttps(value)) {
          state.avatarDraft.src = value;
          $('[data-avatar-error]').textContent = '';
          updateAvatarPreview();
        }
      }
    });
    root.addEventListener('change',event => {
      if (event.target.matches('[data-avatar-file]')) handleAvatarFile(event.target.files && event.target.files[0]);
    });
    root.addEventListener('compositionstart',event => {
      if (event.target.matches('[data-character-search]')) state.searchComposing = true;
    });
    root.addEventListener('compositionend',event => {
      if (!event.target.matches('[data-character-search]')) return;
      state.searchComposing = false;
      state.search = event.target.value;
      renderCharacters(state.stat);
      const next = $('[data-character-search]');
      if (next) { next.focus(); next.setSelectionRange(state.search.length,state.search.length); }
    });
    root.addEventListener('keydown',event => {
      const currentTab = event.target.closest('[data-hud-tab]');
      if (currentTab && ['ArrowRight','ArrowLeft','Home','End'].includes(event.key)) {
        event.preventDefault();
        const tabs = all('[data-hud-tab]');
        let index = tabs.indexOf(currentTab);
        if (event.key === 'ArrowRight') index = (index+1)%tabs.length;
        if (event.key === 'ArrowLeft') index = (index-1+tabs.length)%tabs.length;
        if (event.key === 'Home') index = 0;
        if (event.key === 'End') index = tabs.length-1;
        activateTab(tabs[index].dataset.hudTab,true);
        return;
      }
      const character = event.target.closest('[data-character-key]');
      if (character && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        openCharacterDrawer(character.dataset.characterKey,character);
        return;
      }
      if (event.key === 'Escape') {
        if (!$('[data-cg-lightbox]').hidden) closeCgLightbox();
        else if (!$('[data-avatar-dialog]').hidden) closeAvatarEditor();
        else if (!$('[data-character-drawer]').hidden) closeCharacterDrawer();
      }
      trapFocus(event,$('[data-cg-lightbox]'));
      trapFocus(event,$('[data-avatar-dialog]'));
      trapFocus(event,$('[data-character-drawer]'));
    });
    window.addEventListener('storage',event => {
      if (event.key !== AVATAR_STORAGE_KEY) return;
      state.avatarStore = loadAvatarStore();
      renderAll(state.stat,true);
      setSyncStatus('头像设置已同步','ready');
    });
    window.addEventListener('beforeunload',() => {
      clearTimeout(state.refreshTimer);
      state.disposers.splice(0).forEach(dispose => { try { dispose(); } catch (_) {} });
    },{ once:true });
  }

  (async function init() {
    normalizeDuplicateHudInMessage();
    setTimeout(normalizeDuplicateHudInMessage,120);
    setTimeout(normalizeDuplicateHudInMessage,500);
    bindEvents();
    try {
      if (typeof getCurrentMessageId === 'function') state.messageId = getCurrentMessageId();
    } catch (_) {}
    await waitMvu();
    refresh(true,'已同步');
    setTimeout(() => refresh(true,'已同步'),600);
    subscribeMvu();
  })();
</script>
</body>
